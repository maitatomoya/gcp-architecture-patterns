<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCP Architecture Patterns - ケースで学ぶGCPアーキテクチャ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header id="sidebar-header">
        <h1>GCP Architecture Patterns</h1>
        <div id="progress-wrap" title="読了チェックはこのブラウザにのみ保存されます。端末を移すときは「進捗をコピー」で書き出してください">
          <div id="progress-bar" role="progressbar" aria-label="読了ケース数"
               aria-valuemin="0" aria-valuemax="50" aria-valuenow="0"><div id="progress-fill"></div></div>
          <span id="progress-label">0 / 0</span>
        </div>
        <div id="progress-actions">
          <button type="button" id="btn-progress-export" class="mini-btn"
                  title="読了状況を文字列にしてコピーします。別の端末で「読み込む」に貼り付けると復元できます">進捗をコピー</button>
          <button type="button" id="btn-progress-import" class="mini-btn"
                  aria-expanded="false" title="コピーした進捗の文字列を貼り付けて読み込みます">読み込む</button>
        </div>
        <div id="progress-panel" hidden></div>
        <p id="progress-msg" role="status" aria-live="polite" hidden></p>
      </header>
      <div id="toc-search-wrap">
        <input type="search" id="toc-search" placeholder="ケースを検索（サービス名でも）"
               aria-label="ケースを検索（サービス名でも）" autocomplete="off">
      </div>
      <nav id="toc" aria-label="ケース一覧"></nav>
      <footer id="sidebar-footer">
        <span>図はカテゴリ色の凡例つき独自描画</span>
      </footer>
    </aside>
    <main id="main">
      <div id="case-view" hidden></div>
      <div id="welcome" class="placeholder">
        <h2>ようこそ</h2>
        <p>左のケース一覧から始めましょう。</p>
      </div>
    </main>
  </div>
